server {
listen 80;
server_name _;
root /var/www/meat-lovers-cims/apps/website/dist;
index index.html;
location / {
try_files $uri $uri/ /index.html;
}
location /admin {
alias /var/www/meat-lovers-cims/apps/admin-web/dist;
try_files $uri $uri/ /admin/index.html;
}
location /pos {
alias /var/www/meat-lovers-cims/apps/pos-pwa/dist;
try_files $uri $uri/ /pos/index.html;
}
location /monitoring {
alias /var/www/meat-lovers-cims/apps/monitoring-web/dist;
try_files $uri $uri/ /monitoring/index.html;
}
location /api {
alias /var/www/meat-lovers-cims/backend/public;
try_files $uri $uri/ /index.php?$query_string;
}
location ~ \.php$ {
include snippets/fastcgi-php.conf;
fastcgi_pass unix:/run/php/php8.5-fpm.sock;
}
}
