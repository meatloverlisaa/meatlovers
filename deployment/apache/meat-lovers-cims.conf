<VirtualHost *:80>
    ServerName meat-lovers.local
    DocumentRoot /var/www/meat-lovers-cims/apps/website/dist
    Alias /admin /var/www/meat-lovers-cims/apps/admin-web/dist
    Alias /pos /var/www/meat-lovers-cims/apps/pos-pwa/dist
    Alias /monitoring /var/www/meat-lovers-cims/apps/monitoring-web/dist
    Alias /api /var/www/meat-lovers-cims/backend/public
    <Directory /var/www/meat-lovers-cims>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
